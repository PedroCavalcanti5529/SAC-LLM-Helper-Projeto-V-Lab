[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-prompt-assistant"
version = "0.1.0"
description = "Gera conteúdo de suporte técnico adaptado ao perfil do cliente, com prompts versionados."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Interface web opcional (app/streamlit_app.py). A CLI continua só com as dependências mínimas.
web = ["streamlit>=1.37"]

[project.scripts]
support-assistant = "support_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
